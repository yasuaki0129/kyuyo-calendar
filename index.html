    document.addEventListener("click", function (ev) {
      const t = ev.target.closest("[data-action]");
      if (!t) {
        if (ev.target === document.getElementById("backdrop")) closeSheet();
        return;
      }
      const action = t.dataset.action;
      if (action === "prev-month") {
        state.view = new Date(state.view.getFullYear(), state.view.getMonth() - 1, 1);
        render();
      } else if (action === "next-month") {
        state.view = new Date(state.view.getFullYear(), state.view.getMonth() + 1, 1);
        render();
      } else if (action === "go-today") {
        const n = todayDate();
        state.view = new Date(n.getFullYear(), n.getMonth(), 1);
        render();
      } else if (action === "open-menu") openMenu();
      else if (action === "close-sheet") closeSheet();
      else if (action === "open-day") openDay(t.dataset.date);
      else if (action === "new-entry") openEntryForm(blankEntry(dayDate));
      else if (action === "edit-entry") {
        const e = state.entries.find(function (x) { return x.id === t.dataset.id; });
        if (e) openEntryForm(e);
      } else if (action === "back-day") openDay(dayDate);
      else if (action === "set-calc") {
        formDraft = readForm();
        formDraft.calcType = t.dataset.v;
        const daily = document.getElementById("rate-daily");
        const hourly = document.getElementById("rate-hourly");
        if (daily) daily.hidden = formDraft.calcType === "hourly";
        if (hourly) hourly.hidden = formDraft.calcType !== "hourly";
        document.querySelectorAll("#calc-seg button").forEach(function (b) {
          b.classList.toggle("on", b.dataset.v === formDraft.calcType);
        });
        refreshLive();
      } else if (action === "set-status") {
        formDraft = readForm();
        formDraft.status = t.dataset.v;
        document.querySelectorAll("#status-seg button").forEach(function (b) {
          b.classList.toggle("on", b.dataset.v === formDraft.status);
        });
      } else if (action === "delete-entry") deleteEntry(editingId || (formDraft && formDraft.id));
      else if (action === "edit-goal") openGoalEditor();
      else if (action === "clear-month-goal") {
        delete state.monthlyGoals[ymKey(state.view)];
        persist();
        closeSheet();
        render();
      } else if (action === "set-weekstart") {
        state.weekStartsOn = Number(t.dataset.v) === 1 ? 1 : 0;
        persist();
        render();
        openMenu();
      } else if (action === "open-clients") { colorTarget = null; openClients(); }
      else if (action === "pick-color" || action === "edit-client") { colorTarget = t.dataset.name; openClients(); }
      else if (action === "apply-color") {
        if (colorTarget) {
          ensureClient(colorTarget);
          state.clients[colorTarget].color = t.dataset.color;
          persist();
          render();
          openClients();
        }
      } else if (action === "set-close") {
        colorTarget = t.dataset.name;
        ensureClient(colorTarget);
        if (t.dataset.v === "custom") {
          const cur = state.clients[colorTarget].closeDay;
          if (cur === "end" || cur === 15 || cur === 20 || cur === 25 || cur === "15" || cur === "20" || cur === "25") {
            state.clients[colorTarget].closeDay = 10;
          }
        } else if (t.dataset.v === "end") {
          state.clients[colorTarget].closeDay = "end";
        } else {
          state.clients[colorTarget].closeDay = Number(t.dataset.v);
        }
        persist();
        render();
        openClients();
      } else if (action === "set-pay") {
        colorTarget = t.dataset.name;
        ensureClient(colorTarget);
        if (t.dataset.months === "custom") {
          if (!isCustomPay(clientTerms(colorTarget))) {
            state.clients[colorTarget].payMonthsLater = 1;
            state.clients[colorTarget].payDay = 8;
          }
        } else {
          state.clients[colorTarget].payMonthsLater = Number(t.dataset.months);
          state.clients[colorTarget].payDay = t.dataset.day === "end" ? "end" : Number(t.dataset.day);
        }
        persist();
        render();
        openClients();
      } else if (action === "mark-paid-group") {
        setGroupStatus(t.dataset.key, "paid");
        persist();
        render();
        openPayments();
      } else if (action === "mark-unpaid-group") {
        setGroupStatus(t.dataset.key, "billed");
        persist();
        render();
        openPayments();
      } else if (action === "forget-client") {
        const name = t.dataset.name;
        if (confirm(name + " を請求先リストから外しますか？")) {
          delete state.clients[name];
          persist();
          if (colorTarget === name) colorTarget = null;
          openClients();
          render();
        }
      } else if (action === "open-invoices") openInvoices();
      else if (action === "invoice-client") { invoiceClient = t.dataset.name; openInvoices(); }
      else if (action === "print-invoice") {
        document.body.classList.add("printing");
        window.print();
      } else if (action === "open-payments") openPayments();
      else if (action === "export-csv") exportCsv();
      else if (action === "export-json") exportJson();
      else if (action === "import-json") document.getElementById("import-file").click();
    });

    document.addEventListener("change", function (ev) {
      if (ev.target && ev.target.id === "withhold-toggle") {
        state.showWithholding = ev.target.checked;
        persist();
        render();
        return;
      }
      if (ev.target && ev.target.id === "import-file" && ev.target.files[0]) {
        importJsonFile(ev.target.files[0]);
        ev.target.value = "";
      }
      if (ev.target && ev.target.closest("#entry-form")) refreshLive();
      if (ev.target && ev.target.closest("#client-terms-form")) {
        saveCustomTerms();
      }
    });
    document.addEventListener("input", function (ev) {
      if (ev.target && ev.target.closest("#entry-form")) refreshLive();
      if (ev.target && ev.target.closest("#client-terms-form")) {
        saveCustomTerms();
      }
      if (ev.target && ev.target.name === "client" && ev.target.closest("#entry-form")) {
        refreshProjectList();
      }
      if (ev.target && ev.target.name === "client" && ev.target.closest("#entry-form") && !editingId) {
        const last = lastEntryForClient(ev.target.value.trim());
        if (last) {
          formDraft = readForm();
          if (!rateFieldFilled("dailyRate") && !rateFieldFilled("hourlyRate")) {
            formDraft.calcType = last.calcType;
            formDraft.dailyRate = last.dailyRate;
            formDraft.hourlyRate = last.hourlyRate;
            const dailyIn = document.querySelector('#entry-form [name="dailyRate"]');
            const hourlyIn = document.querySelector('#entry-form [name="hourlyRate"]');
            if (dailyIn) dailyIn.value = last.dailyRate || "";
            if (hourlyIn) hourlyIn.value = last.hourlyRate || "";
            const daily = document.getElementById("rate-daily");
            const hourly = document.getElementById("rate-hourly");
            if (daily) daily.hidden = formDraft.calcType === "hourly";
            if (hourly) hourly.hidden = formDraft.calcType !== "hourly";
            document.querySelectorAll("#calc-seg button").forEach(function (b) {
              b.classList.toggle("on", b.dataset.v === formDraft.calcType);
            });
            refreshLive();
          }
        }
      }
    });
    document.addEventListener("submit", function (ev) {
      if (ev.target && ev.target.id === "entry-form") {
        ev.preventDefault();
        saveEntry();
      } else if (ev.target && ev.target.id === "goal-form") {
        saveGoal(ev);
      } else if (ev.target && ev.target.id === "default-goal-form") {
        ev.preventDefault();
        state.defaultGoal = parseMoney(ev.target.defaultGoal.value);
        persist();
        render();
        openMenu();
      }
    });
    document.addEventListener("keydown", function (ev) {
      if (ev.key === "Escape" && !document.getElementById("backdrop").hidden) closeSheet();
    });
    window.addEventListener("afterprint", function () {
      document.body.classList.remove("printing");
    });

      computeMinutes: computeMinutes,
      hoursLabel: hoursLabel,
      workPay: workPay,
      entryTotal: entryTotal,
      withholdingOf: withholdingOf,
      formatYen: formatYen,
      compactYen: compactYen,
      crossesMidnight: crossesMidnight,
      remainingDays: remainingDays,
      getGoal: getGoal,
      summarize: summarize,
      ymd: ymd,
      parseYmd: parseYmd,

      entryClosingYmd: entryClosingYmd,
      entryNet: entryNet,
      periodLabel: periodLabel,
      paymentGroups: paymentGroups,
      weekdayColor: weekdayColor,
      monthCells: monthCells,
      WEEKDAYS_EN: WEEKDAYS_EN,
      state: state
    };

    const params = new URLSearchParams(location.search);
    load();
    if (params.get("demo") === "1") {
      seedDemo();
      persist();
    } else {
      const n = todayDate();
      state.view = new Date(n.getFullYear(), n.getMonth(), 1);
    }
    render();
  })();

  if ((location.protocol === "http:" || location.protocol === "https:") && "serviceWorker" in navigator) {
    navigator.serviceWorker.register("./sw.js", { scope: "./" }).catch(function () {});
